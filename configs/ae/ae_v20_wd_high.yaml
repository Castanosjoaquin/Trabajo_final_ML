model: ae
name: ae_v20_wd_high
cultivo: ambos
backend: local

# v11 con weight_decay=0.001 (10x). L2 más fuerte para suavizar los pesos.
hidden_dims: [128, 64]
latent_dim: 16
activation: relu
lr: 0.001
weight_decay: 0.001
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0
lr_schedule: cosine
max_epochs: 300
patience: 40
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
