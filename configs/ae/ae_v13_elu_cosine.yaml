model: ae
name: ae_v13_elu_cosine
cultivo: ambos
backend: local

# Arquitectura ganadora (v11) con ELU en lugar de ReLU.
# ELU: suave para x<0, sin neuronas muertas, mejor gradiente que ReLU.
# Estudios en AE muestran que ELU/LeakyReLU mejoran la separabilidad normal/anómalo.
hidden_dims: [128, 64]
latent_dim: 16
activation: elu
lr: 0.001
weight_decay: 0.0001
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0
lr_schedule: cosine
max_epochs: 300
patience: 40
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
