model: ae
name: ae_v7_wide_latent22
cultivo: ambos
backend: local

# Latent=22 sin capas ocultas (ratio 22/54 ≈ 0.41).
# Prueba si un espacio latente más grande captura mejor la variabilidad normal.
hidden_dims: []
latent_dim: 22
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
