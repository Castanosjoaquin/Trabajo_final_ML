model: ae
name: ae_score_max
cultivo: ambos
backend: local

# Mismo AE que ae_v3 (latent 16, sin capas ocultas), pero el score de anomalía
# es el MÁXIMO error de reconstrucción por feature en vez del MSE promedio.
# Hipótesis: con 54 features, si solo unas pocas reconstruyen muy mal, el MSE
# promedio diluye la señal; el máximo la preserva.
hidden_dims: []
latent_dim: 16
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

score_mode: max

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
