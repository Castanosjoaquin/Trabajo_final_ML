model: ae
name: ae_v19_dropout_high
cultivo: ambos
backend: local

# v11 con dropout=0.2. Más regularización para reducir gap train/test.
hidden_dims: [128, 64]
latent_dim: 16
activation: relu
lr: 0.001
weight_decay: 0.0001
dropout: 0.2
use_batch_norm: true
grad_clip_norm: 1.0
lr_schedule: cosine
max_epochs: 300
patience: 40
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
