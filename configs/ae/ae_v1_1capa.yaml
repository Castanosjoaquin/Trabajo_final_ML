model: ae
name: ae_v1_1capa
cultivo: ambos
backend: local

# Arquitectura mínima: encoder 67->latent, decoder latent->67 (sin capas ocultas).
# Línea base para AE. Alta estabilidad entre semillas.
hidden_dims: []
latent_dim: 8
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
