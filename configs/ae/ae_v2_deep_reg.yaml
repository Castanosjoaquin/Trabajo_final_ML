model: ae
name: ae_v2_deep_reg
cultivo: ambos
backend: local

# Arquitectura con capas intermedias + regularización:
# encoder 67->32->16->latent, dropout y weight decay para reducir varianza.
hidden_dims: [32, 16]
latent_dim: 4
lr: 0.001
weight_decay: 0.0001
dropout: 0.1
max_epochs: 200
patience: 15
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
