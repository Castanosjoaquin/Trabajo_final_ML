model: ae
name: ae_v17_elu_wider
cultivo: ambos
backend: local

# ELU + arquitectura más ancha: [256, 128] con latent=16.
# Más capacidad en las capas ocultas para modelar correlaciones climáticas.
hidden_dims: [256, 128]
latent_dim: 16
activation: elu
lr: 0.001
weight_decay: 0.0001
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0
lr_schedule: cosine
max_epochs: 300
patience: 40
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
