model: ae
name: ae_v8_hidden128_latent22
cultivo: ambos
backend: local

# 1 capa oculta ancha + latent=22: 54->128->22->128->54.
# Capa oculta overcomplete (128>54) para representación rica antes del bottleneck.
# Latent=22 basado en hallazgo de que latent mayor ayuda con BN.
hidden_dims: [128]
latent_dim: 22
lr: 0.001
weight_decay: 0.0001
dropout: 0.1
use_batch_norm: true
max_epochs: 250
patience: 20
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
