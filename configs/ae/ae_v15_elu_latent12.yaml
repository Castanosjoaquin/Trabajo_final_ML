model: ae
name: ae_v15_elu_latent12
cultivo: ambos
backend: local

# ELU + latent=12: compresión más fuerte que latent=16 (ratio 12/54 ≈ 0.22).
# Hipótesis: bottleneck más ajustado fuerza mejor separación normal/anómalo.
hidden_dims: [128, 64]
latent_dim: 12
activation: elu
lr: 0.001
weight_decay: 0.0001
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0
lr_schedule: cosine
max_epochs: 300
patience: 40
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
