model: vae
name: vae_reg
cultivo: ambos
backend: local
panel_path: data/processed/panel_union.parquet

# VAE regularizado para n~750: bottleneck más chico + weight decay.
hidden_dims: [32, 16]
latent_dim: 4
beta: 1.0
score_mode: recon_error   # recon_error | recon_prob | neg_elbo
n_mc_samples: 20
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

# Evaluación robusta
n_seeds: 10
threshold_mode: contamination   # contamination | f1
eval_contamination: 0.10
random_state: 42
