model: ensemble
name: ae_seedens_v1
cultivo: ambos
backend: local

# Seed-ensemble del AE (mismo patrón que el VAE ganador, pero con AE). Testea si
# el ensemble + AE alcanza al VAE recon_prob. El EnsembleDetector es agnóstico al
# modelo, así que sale gratis.
normalize: zscore
combine: mean
n_members: 10
base:
  model: ae
  hidden_dims: [64, 32]
  latent_dim: 16
  score_mode: mse
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  patience: 30
  batch_size: 64

n_seeds: 3
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
