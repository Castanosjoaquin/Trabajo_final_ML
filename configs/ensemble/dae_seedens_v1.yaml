model: ensemble
name: dae_seedens_v1
cultivo: ambos
backend: local

# Seed-ensemble del Denoising AE. El DAE se entrena reconstruyendo limpio desde
# input corrupto → robusto a features ruidosas (tu intuición). Panel base limpio.
normalize: zscore
combine: mean
n_members: 10
base:
  model: dae
  hidden_dims: [64, 32]
  latent_dim: 16
  corruption: 0.1
  noise_type: salt_pepper
  score_mode: mse
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  patience: 30
  batch_size: 64

n_seeds: 3
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
