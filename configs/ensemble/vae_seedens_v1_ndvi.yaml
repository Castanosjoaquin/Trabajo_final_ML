model: ensemble
name: vae_seedens_v1_ndvi
cultivo: ambos
backend: local

# EXPERIMENTO NDVI — el MEJOR modelo (seed-ensemble vae_v4) con NDVI, 2002+.
# use_ndvi/train_start son flags de experimento → aplican a todos los miembros.
use_ndvi: true
train_start: 2002

normalize: zscore
combine: mean
n_members: 10
base:
  model: vae
  hidden_dims: [64, 32]
  latent_dim: 16
  beta: 1.0
  score_mode: recon_prob
  n_mc_samples: 50
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.0
  max_epochs: 300
  patience: 30
  batch_size: 64

n_seeds: 3
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
