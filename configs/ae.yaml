model: ae
name: ae_1capa
cultivo: ambos
backend: wandb

# Arquitectura de 1 capa: encoder 61->8, decoder 8->61 (sin capas ocultas).
# Es la más estable (varianza ~0 entre semillas) — una sola seed ya es
# representativa. Evita la expansión 61->64 que inflaba la varianza.
hidden_dims: []
latent_dim: 8
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

# Evaluación robusta
n_seeds: 10
threshold_mode: contamination   # contamination | f1
eval_contamination: 0.10
random_state: 42
