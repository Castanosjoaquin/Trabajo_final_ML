# Mejor config encontrada por el W&B sweep (AE/DAE)
# Top-1: DAE, hidden=[], latent=12, bn=True, drop=0.1, lr=0.00855
# Patrón consistente en top-5: 1 capa + batch norm + patience alta
name: ae_best
model: dae
cultivo: ambos
backend: wandb

# Arquitectura (1 capa — gana consistentemente)
hidden_dims: []
latent_dim: 12

# DAE: ruido en entrada
noise_type: salt_pepper
corruption: 0.1

# Optimización
lr: 0.00855
batch_size: 32
max_epochs: 300
patience: 30
weight_decay: 0.00001

# Regularización
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0

# Evaluación multi-seed
n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
