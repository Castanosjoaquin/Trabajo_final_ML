# Mejor config encontrada por el W&B sweep (VAE)
# Top-1: hidden=[], latent=16, beta=0.148, score=neg_elbo, bn=False
# Patrón top-5: 1 capa, latent grande, beta bajo (<1), score=neg_elbo, patience=30
name: vae_best
model: vae
cultivo: ambos
backend: wandb

# Arquitectura
hidden_dims: []
latent_dim: 16

# VAE
beta: 0.148
score_mode: neg_elbo
n_mc_samples: 20

# Optimización
lr: 0.00035
batch_size: 64
max_epochs: 300
patience: 30
weight_decay: 0.001

# Regularización
dropout: 0.1
use_batch_norm: false
grad_clip_norm: 1.0

# Evaluación multi-seed
n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
