model: iforest
name: iforest_v5_mf05_n300
cultivo: ambos
backend: local

# Tuning: la mejor max_features (0.5) con más árboles (300) para reducir varianza.
n_estimators: 300
max_samples: auto
max_features: 0.5
contamination: auto
random_state: 42

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
