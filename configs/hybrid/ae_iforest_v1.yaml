model: ae_iforest
name: ae_iforest_v1
cultivo: ambos
backend: local

# Híbrido: AE proyecta a un latente de 8 dims, IsolationForest scorea sobre ese
# latente (no sobre el error de reconstrucción). Combina la reducción
# dimensional del AE con la estabilidad del IForest.
# AE: encoder 54->32->16->8 (igual capacidad que el AE base regularizado).
hidden_dims: [32, 16]
latent_dim: 8
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

# IForest sobre el latente (8 dims): max_features=1.0 porque el latente ya es
# de baja dimensión (no hace falta submuestrear features).
n_estimators: 200
max_samples: auto
max_features: 1.0
contamination: auto

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
