model: vae
name: vae_studentt_v1
cultivo: ambos
backend: local

# Base = vae_v4 ganador (recon_prob, lat16, limpio) pero con decoder Student-t
# (colas pesadas, ν=4): robusto a outliers residuales en el train "normal" y
# estabiliza el problema de varianza-cero del decoder Gaussiano. Debería bajar
# la varianza del score y/o mejorar recon_prob.
hidden_dims: [64, 32]
latent_dim: 16
beta: 1.0
score_mode: recon_prob
n_mc_samples: 50
decoder_dist: student_t
student_t_df: 4.0
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
