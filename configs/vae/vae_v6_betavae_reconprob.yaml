model: vae
name: vae_v6_betavae_reconprob
cultivo: ambos
backend: local

# HIPÓTESIS 3 — β-VAE (beta=4) para un latente más estructurado/desenredado,
# combinado con el score probabilístico. La idea opuesta a v5: un latente bien
# regularizado puede dar un p(x|z) más limpio para detectar lo "improbable".
hidden_dims: [32, 16]
latent_dim: 8
beta: 4.0
score_mode: recon_prob
n_mc_samples: 50
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
grad_clip_norm: 1.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
