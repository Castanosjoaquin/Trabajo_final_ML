model: vae
name: vae_v11_reconprob_lat20
cultivo: ambos
backend: local

# Refinamiento de v4: aísla el efecto del latente (20 vs 16). Latente más ancho
# = decoder con más capacidad para modelar p(x|z) de los normales.
hidden_dims: [64, 32]
latent_dim: 20
beta: 1.0
score_mode: recon_prob
n_mc_samples: 50
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
