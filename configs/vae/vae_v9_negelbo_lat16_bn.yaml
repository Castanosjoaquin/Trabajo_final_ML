model: vae
name: vae_v9_negelbo_lat16_bn
cultivo: ambos
backend: local

# HIPÓTESIS 6 — refinar el ganador exacto del sweep (vae_v3: latent 16,
# beta 0.148, neg_elbo) agregándole capas ocultas + batch norm + grad clip +
# entrenamiento largo, para ver si más capacidad/estabilidad mejora un patrón
# ya validado en lugar de explorar a ciegas.
hidden_dims: [64, 32]
latent_dim: 16
beta: 0.148
score_mode: neg_elbo
n_mc_samples: 20
lr: 0.00035
weight_decay: 0.001
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0
max_epochs: 400
patience: 50
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
