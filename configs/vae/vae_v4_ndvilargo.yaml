model: vae
name: vae_v4_ndvilargo
cultivo: ambos
backend: local

# EXPERIMENTO NDVI-AVHRR (historia completa 1981+, SIN el confound del recorte).
# Usa el panel aumentado con NDVI mensual de AVHRR (merge_avhrr_ndvi.py).
# build_feature_list toma ndvi_avhrr_<mes> automáticamente con use_ndvi: true.
# Comparar contra vae_v4_reconprob_lat16 (mismo modelo, panel base sin NDVI) =
# ablación limpia: misma historia, misma etiqueta, solo difiere el NDVI.
panel_path: data/processed/panel_union_ndvi.parquet
use_ndvi: true
# (SIN train_start: AVHRR cubre 1981+, no hace falta recortar)

hidden_dims: [64, 32]
latent_dim: 16
beta: 1.0
score_mode: recon_prob
n_mc_samples: 50
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
