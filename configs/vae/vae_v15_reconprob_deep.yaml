model: vae
name: vae_v15_reconprob_deep
cultivo: ambos
backend: local

# Refinamiento de v4: más capacidad ([128,64] vs [64,32]) con la receta limpia
# ganadora. v7 ya probó [128,64] pero confundido con recon_error+BN+lat22; acá
# se aísla la capacidad con recon_prob limpio + latent 16.
hidden_dims: [128, 64]
latent_dim: 16
beta: 1.0
score_mode: recon_prob
n_mc_samples: 50
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
