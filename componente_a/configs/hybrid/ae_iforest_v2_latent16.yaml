model: ae_iforest
name: ae_iforest_v2_latent16
cultivo: ambos

# Variante con latente más ancho (16 dims, ratio ~16/54 ≈ 0.30 como ae_v3).
# Más espacio de representación → IForest tiene más estructura que aislar,
# y se baja max_features a 0.5 para sensibilizar a anomalías locales del latente.
hidden_dims: [32]
latent_dim: 16
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

n_estimators: 200
max_samples: auto
max_features: 0.5
contamination: auto

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
