model: ae
name: ae_v4_hidden64_bn
cultivo: ambos

# 1 capa oculta + BatchNorm: 54->64->8->64->54.
# Capa oculta overcomplete (64>54) fuerza al bottleneck a comprimir más fuerte.
# BatchNorm estabiliza gradientes y reduce varianza entre seeds.
hidden_dims: [64]
latent_dim: 8
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
use_batch_norm: true
max_epochs: 200
patience: 20
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
