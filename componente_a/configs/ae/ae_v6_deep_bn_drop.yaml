model: ae
name: ae_v6_deep_bn_drop
cultivo: ambos

# 2 capas + BatchNorm + dropout: 54->64->32->8->32->64->54.
# Combina todas las regularizaciones: BN para estabilidad + dropout para generalización.
# Basado en patrón top-5 del sweep: 1-2 capas + BN + patience alta.
hidden_dims: [64, 32]
latent_dim: 8
lr: 0.001
weight_decay: 0.0001
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0
max_epochs: 300
patience: 25
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
