model: ae
name: ae_v11_cosine_deep
cultivo: ambos

# Mejor arquitectura del v1 (v5/v6) + cosine LR schedule.
# Cosine annealing: lr decae de 0.001 a 1e-5 siguiendo curva cosenoidal,
# evita que el modelo se estanque en mínimos locales planos.
hidden_dims: [128, 64]
latent_dim: 16
lr: 0.001
weight_decay: 0.0001
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0
lr_schedule: cosine
max_epochs: 300
patience: 40
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
