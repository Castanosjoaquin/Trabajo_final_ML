model: ae
name: ae_v16_elu_latent20
cultivo: ambos

# ELU + latent=20: espacio latente más amplio que latent=16 (ratio 20/54 ≈ 0.37).
# Contraste con v15: ¿latent grande o chico funciona mejor con ELU?
hidden_dims: [128, 64]
latent_dim: 20
activation: elu
lr: 0.001
weight_decay: 0.0001
dropout: 0.1
use_batch_norm: true
grad_clip_norm: 1.0
lr_schedule: cosine
max_epochs: 300
patience: 40
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
