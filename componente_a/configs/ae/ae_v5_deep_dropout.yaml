model: ae
name: ae_v5_deep_dropout
cultivo: ambos

# 2 capas ocultas + dropout: 54->128->64->16->64->128->54.
# Latent=16 (ratio ~0.30) + dropout=0.2 como regularizador.
# Arquitectura ancha-profunda para capturar correlaciones no lineales (paper, Sec. 3.2).
hidden_dims: [128, 64]
latent_dim: 16
lr: 0.001
weight_decay: 0.0001
dropout: 0.2
use_batch_norm: false
max_epochs: 200
patience: 20
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
