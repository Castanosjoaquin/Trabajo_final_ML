model: dae
name: dae_v1_base
cultivo: ambos

# Denoising AE base: arquitectura [64,32], salt-and-pepper 10%.
hidden_dims: [64, 32]
latent_dim: 8
corruption: 0.1
noise_type: salt_pepper
lr: 0.001
weight_decay: 0.0
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
