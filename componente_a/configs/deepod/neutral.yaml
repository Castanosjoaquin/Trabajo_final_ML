model: deepod
algo: neutral
name: deepod_neutral
cultivo: ambos

# Comparación JUSTA: 300 épocas + capacidad pareja (hidden_dims 64,32, rep_dim 16,
# trans_hidden_dims 32) en vez de los defaults (100 épocas, rep_dim 128, 100,50).
epochs: 300
batch_size: 64
lr: 0.001
extra:
  rep_dim: 16
  hidden_dims: "64,32"
  trans_hidden_dims: "32"

n_seeds: 5
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
