model: ensemble
name: vae_seedens_v1_ndvilargo
cultivo: ambos

# EXPERIMENTO NDVI-AVHRR sobre el MODELO SOTA (seed-ensemble vae_v4), historia
# completa. Comparar contra vae_seedens_v1 (panel base) → ¿el verdor vegetal de
# 1981+ ayuda con las anomalías "clima normal / rinde anómalo"?
panel_path: data/processed/panel_union_ndvi.parquet
use_ndvi: true

normalize: zscore
combine: mean
n_members: 10
base:
  model: vae
  hidden_dims: [64, 32]
  latent_dim: 16
  beta: 1.0
  score_mode: recon_prob
  n_mc_samples: 50
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.0
  max_epochs: 300
  patience: 30
  batch_size: 64

n_seeds: 3
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
