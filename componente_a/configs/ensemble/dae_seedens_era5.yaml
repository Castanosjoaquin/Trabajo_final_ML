model: ensemble
name: dae_seedens_era5
cultivo: ambos

# DAE seed-ensemble SOBRE las features ERA5 (suelo/heladas). Test directo de tu
# hipótesis: ¿el denoising rescata las features que diluían al VAE? Si el DAE+ERA5
# supera al VAE+ERA5 (que perjudicaba), la robustez al ruido sirve.
panel_path: data/processed/panel_union_era5.parquet
use_era5_features: true

normalize: zscore
combine: mean
n_members: 10
base:
  model: dae
  hidden_dims: [64, 32]
  latent_dim: 16
  corruption: 0.1
  noise_type: salt_pepper
  score_mode: mse
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  patience: 30
  batch_size: 64

n_seeds: 3
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
