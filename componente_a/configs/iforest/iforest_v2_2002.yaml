model: iforest
name: iforest_v2_2002
cultivo: ambos

# EXPERIMENTO NDVI — brazo CONTROL "2002+ SIN NDVI" del IForest (mf=0.3).
# Mismo período que iforest_v2_ndvi pero sin NDVI → aísla el efecto de NDVI.
use_ndvi: false
train_start: 2002

n_estimators: 200
max_samples: auto
max_features: 0.3
contamination: auto
random_state: 42

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
