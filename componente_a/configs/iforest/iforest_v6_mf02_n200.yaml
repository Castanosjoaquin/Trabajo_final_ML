model: iforest
name: iforest_v6_mf02_n200
cultivo: ambos

# Tuning: estira la tendencia ganadora (max_features bajo mejora) a 0.2
# (~11 de 54 features por árbol). Aún más sensible a anomalías locales.
n_estimators: 200
max_samples: auto
max_features: 0.2
contamination: auto
random_state: 42

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
