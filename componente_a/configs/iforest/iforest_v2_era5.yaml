model: iforest
name: iforest_v2_era5
cultivo: ambos

# EXPERIMENTO ERA5 en el IFOREST (el que mejor tolera/aprovecha features extra).
# Humedad de suelo + heladas vs iforest_v2 base limpio (soja 0.511 / maíz 0.492).
panel_path: data/processed/panel_union_era5.parquet
use_era5_features: true

n_estimators: 200
max_samples: auto
max_features: 0.3
contamination: auto
random_state: 42

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
