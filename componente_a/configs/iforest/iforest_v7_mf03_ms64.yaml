model: iforest
name: iforest_v7_mf03_ms64
cultivo: ambos

# Tuning: mejor max_features (0.3) con max_samples bajo (64). Submuestreo más
# agresivo por árbol → árboles más cortos, suele aislar mejor anomalías raras.
n_estimators: 200
max_samples: 64
max_features: 0.3
contamination: auto
random_state: 42

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
