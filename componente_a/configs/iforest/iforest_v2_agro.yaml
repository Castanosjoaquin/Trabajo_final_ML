model: iforest
name: iforest_v2_agro
cultivo: ambos

# Ablation: iforest_v2 (mf=0.3, n=200) + features agronómicas de dominio.
# Comparar contra iforest_v2_mf03_n200 (sin agro) para ver si las features de
# ventana crítica ayudan también al baseline fuerte.
use_agro_features: true

n_estimators: 200
max_samples: auto
max_features: 0.3
contamination: auto
random_state: 42

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
