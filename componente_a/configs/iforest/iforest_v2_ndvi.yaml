model: iforest
name: iforest_v2_ndvi
cultivo: ambos

# EXPERIMENTO NDVI — brazo "2002+ CON NDVI" sobre el IForest ganador (mf=0.3).
# El IForest aprovechó las features agro antes (submuestrea features) → buen
# candidato a aprovechar NDVI también.
use_ndvi: true
train_start: 2002

n_estimators: 200
max_samples: auto
max_features: 0.3
contamination: auto
random_state: 42

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
