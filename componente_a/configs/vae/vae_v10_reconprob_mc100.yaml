model: vae
name: vae_v10_reconprob_mc100
cultivo: ambos

# Refinamiento de v4 (ganador): mismo recon_prob limpio, pero 100 muestras MC.
# Más muestras = estimación de -E[log p(x|z)] menos ruidosa → debería BAJAR la
# varianza entre semillas (±0.031), que es el único punto débil vs IForest.
hidden_dims: [64, 32]
latent_dim: 16
beta: 1.0
score_mode: recon_prob
n_mc_samples: 100
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
