model: vae
name: vae_v13_reconprob_beta0p5
cultivo: ambos

# Refinamiento de v4: aísla beta=0.5 EN LIMPIO. En v8 beta=0.5 dio 0.379, pero
# venía confundido con BN+dropout; acá se mide beta solo (menos peso al KL →
# prioriza reconstrucción). Test honesto de la dirección del beta.
hidden_dims: [64, 32]
latent_dim: 16
beta: 0.5
score_mode: recon_prob
n_mc_samples: 50
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
