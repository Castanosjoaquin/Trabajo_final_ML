model: vae
name: vae_v5_lowbeta_negelbo_reg
cultivo: ambos

# HIPÓTESIS 2 — empujar el ganador del sweep (latent grande + beta bajo +
# neg_elbo) y atacar el problema diagnosticado (VARIANZA) con regularización
# fuerte + entrenamiento largo. beta 0.1 prioriza reconstrucción casi pura.
hidden_dims: [64, 32]
latent_dim: 16
beta: 0.1
score_mode: neg_elbo
n_mc_samples: 20
lr: 0.0005
weight_decay: 0.001
dropout: 0.1
grad_clip_norm: 1.0
max_epochs: 400
patience: 50
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
