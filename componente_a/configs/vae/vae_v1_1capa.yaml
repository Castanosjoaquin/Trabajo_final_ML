model: vae
name: vae_v1_1capa
cultivo: ambos

# Arquitectura mínima: encoder 67->(mu,logvar) latent, decoder latent->67.
# Sin capas ocultas. Score por error de reconstrucción (mu_x).
hidden_dims: []
latent_dim: 8
beta: 1.0
score_mode: recon_error   # recon_error | recon_prob | neg_elbo
n_mc_samples: 20
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 200
patience: 15
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
