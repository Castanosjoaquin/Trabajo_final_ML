model: vae
name: vae_v4_agro
cultivo: ambos

# Ablation: vae_v4 (recon_prob, lat16, limpio) + features agronómicas de dominio
# (ventana crítica Dic–Feb soja / Nov–Ene maíz: precip, estrés térmico, balance
# hídrico Hargreaves). Comparar PR-AUC y recall_clima_adverso vs vae_v4 sin agro.
use_agro_features: true

hidden_dims: [64, 32]
latent_dim: 16
beta: 1.0
score_mode: recon_prob
n_mc_samples: 50
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
