model: vae
name: vae_studentt_df8
cultivo: ambos

# Ídem vae_studentt_v1 con ν=8: colas menos pesadas (más cerca de la Gaussiana).
# Cubre el otro extremo del grado de libertad; ν→∞ recupera el decoder Gaussiano.
hidden_dims: [64, 32]
latent_dim: 16
beta: 1.0
score_mode: recon_prob
n_mc_samples: 50
decoder_dist: student_t
student_t_df: 8.0
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
