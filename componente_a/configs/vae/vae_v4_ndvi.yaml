model: vae
name: vae_v4_ndvi
cultivo: ambos

# EXPERIMENTO NDVI (3 vías) — brazo "2002+ CON NDVI".
# Mismo VAE ganador (vae_v4: recon_prob, lat16, limpio) pero agregando las 4
# features NDVI (ndvi_mean/min/max/anomalia_pct). NDVI mide vigor vegetal real
# → es lo más cercano al rinde que tenemos, candidato a romper el techo
# estructural clima→rinde. NDVI solo existe 2002+, por eso train_start: 2002
# (idéntico período al control para aislar el efecto de NDVI, no del recorte).
use_ndvi: true
train_start: 2002

hidden_dims: [64, 32]
latent_dim: 16
beta: 1.0
score_mode: recon_prob
n_mc_samples: 50
lr: 0.001
weight_decay: 0.0001
dropout: 0.0
max_epochs: 300
patience: 30
batch_size: 64

n_seeds: 10
threshold_mode: contamination
eval_contamination: 0.10
random_state: 42
