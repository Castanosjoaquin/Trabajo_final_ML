# W&B Bayesian sweep — VAE.
#
# Uso:
#   wandb sweep sweeps/vae.yaml         -> imprime SWEEP_ID
#   python train.py --sweep SWEEP_ID --cultivo soja --count 30
program: train.py
project: componente-a-anomalias
method: bayes
metric:
  name: val_loss_mean
  goal: minimize
parameters:

  model_type:
    value: vae

  # --- Arquitectura ---
  hidden_dims:
    values:
      - []          # 1 capa
      - [32]        # mejor del barrido
      - [32, 16]    # 2 ocultas monótonas
      - [64, 32]    # profunda

  latent_dim:
    values: [8, 10, 12, 16]

  # --- Optimización ---
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01

  batch_size:
    values: [32, 64]

  max_epochs:
    value: 300

  # --- Early stopping (variable) ---
  patience:
    values: [10, 20, 30]

  # --- Regularización L2 ---
  weight_decay:
    values: [0.0, 0.00001, 0.0001, 0.001, 0.01]

  # --- Dropout (no llega a 0.3: inestabiliza KL) ---
  dropout:
    values: [0.0, 0.1, 0.2]

  # --- Batch normalization ---
  use_batch_norm:
    values: [true, false]

  # --- Gradient clipping (especialmente útil por gradientes del KL) ---
  grad_clip_norm:
    values: [0.0, 1.0, 5.0]

  # --- Propias del VAE ---
  beta:
    distribution: log_uniform_values
    min: 0.1
    max: 5.0

  score_mode:
    values: [recon_error, neg_elbo]

  # --- Seeds por trial ---
  n_seeds:
    value: 3
