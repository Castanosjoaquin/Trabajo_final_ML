# W&B Bayesian sweep — AE / DAE.
# model_type: ae = autoencoder puro; dae = denoising (noise_type + corruption activos).
#
# Uso:
#   wandb sweep sweeps/ae.yaml          -> imprime SWEEP_ID
#   python train.py --sweep SWEEP_ID --cultivo soja --count 30
program: train.py
project: componente-a-anomalias
method: bayes
metric:
  name: val_loss_mean
  goal: minimize
parameters:

  model_type:
    values: [ae, dae]   # dae activa noise_type + corruption

  # --- Arquitectura ---
  hidden_dims:
    values:
      - []          # 1 capa (lineal puro, mínima varianza)
      - [32]        # mejor del barrido: monótona, 1 oculta
      - [32, 16]    # 2 ocultas monótonas (recomendada por profe)
      - [64, 32]    # profunda

  latent_dim:
    values: [8, 10, 12, 16]

  # --- Optimización ---
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01

  batch_size:
    values: [32, 64]

  max_epochs:
    value: 300

  # --- Early stopping (variable) ---
  patience:
    values: [10, 20, 30]

  # --- Regularización L2 ---
  weight_decay:
    values: [0.0, 0.00001, 0.0001, 0.001, 0.01]

  # --- Dropout ---
  dropout:
    values: [0.0, 0.1, 0.2, 0.3]

  # --- Batch normalization ---
  use_batch_norm:
    values: [true, false]

  # --- Gradient clipping (0.0 = sin clipping) ---
  grad_clip_norm:
    values: [0.0, 1.0, 5.0]

  # --- DAE: ruido en entrada (ignorado si model_type=ae) ---
  noise_type:
    values: [salt_pepper, gaussian]

  corruption:
    values: [0.05, 0.1, 0.2]

  # --- Seeds por trial ---
  n_seeds:
    value: 3
